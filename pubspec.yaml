name: kaksha
description: "Kaksha — CSJMU smart classroom: student & teacher dashboards with a connected smart board."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  table_calendar: ^3.1.2
  google_fonts: ^6.3.0
  http: ^1.2.0
  image_picker: ^1.1.2
  record: 5.0.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_platform_interface: 1.5.0
