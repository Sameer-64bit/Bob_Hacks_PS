name: kaksha
description: "Kaksha — CSJMU smart classroom: student & teacher dashboards with a connected smart board."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.2
  table_calendar: ^3.1.2
  # Wide range: 6.x for older Flutter SDKs, 8.x for 3.44+ (6.x fails to
  # compile there due to a FontWeight change).
  google_fonts: '>=6.3.0 <9.0.0'
  http: ^1.2.0
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  # record 5.x resolves record_linux 0.7.2 which fails to compile (it
  # lags the platform interface); 1.x implements the current interface.
  record_linux: ^1.3.1
